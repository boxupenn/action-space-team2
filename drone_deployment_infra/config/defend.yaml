# defend policy (swarm_ops/policies/defend.py): the sim-trained 3-defender policy on real Tellos.
# All positions are in the TAG-10 frame of config/map.yaml: x right along the wall (seen facing
# the tag), y up, z out of the tag face into the room; metres.

policy_dir: ../../simulation_infra/policies/defend_3v2_arena_s2        # relative to this file; override
                                      # with swarm_policies.py --defend-dir / defend_offline.py --policy-dir
                                      # defender_0.pt -> first drone of --run defend:a,b,c, etc.
site_xyz: [0.0, 0.0, 0.0]             # the protected point = tag 10 itself (sim: site centre 1.25 m up at the wall;
                                      # the attackers' 1.3 m arc is the breach line)
speed_cap: 1.0                        # fraction of full rc on a/b/c: the arena nets were cloned with 1.0 = full stick
                                      # (~2 m/s, sim max_lin_speed 2.0); lowering it changes the geometry (re-clone)
fence:                                # tag-frame box the defenders may not leave (rc outward = 0)
  x: [-0.8, 2.6]                      # map.yaml 2026-10-24: right wall at x~2.8 (tag 8), left mapped to -0.5
  y: [-1.0, 1.0]                      # y is up: floor 1.25 m below tag 10; 1.0 above = 2.25 m altitude
  z: [0.4, 4.8]                       # floor tags reach z~5.2
height_cm: [50, 225]                  # tof range: no more down below / up above these
# Launch spots (tag frame x, z; altitude): defender_0 (0.2, 2.0) 1.9 m, defender_1 (1.6, 1.6) 2.05 m,
# defender_2 (-0.4, 1.6) 2.2 m -- the sim's defender_spawn_xy / heights; the policy flies back there when the
# field is cleared and the goalkeeper waits there. Attackers start 2-3 m in front of tag 10 at 1.2-1.7 m.
alert_radius: 2.2                     # goalkeeper dispatch (sim teacher_alert_radius): attacker nearer the site than this ...
cover_m: 1.2                          # ... and no active teammate within this of it (sim teacher_cover_m); arena nets need both
alert_force: 1.7                      # ... or, inside this of the site, regardless of cover (sim teacher_alert_force)
sep_guard_m: 0.6                      # defenders closer than this: the higher-index one holds horizontally
sep_release_m: 0.8                    # ... until they are this far apart again

attackers: bus                        # bus | scripted | telemetry | udp
                                      # `bus` (THE ARENA): the organisers' swarm_formation.py attackers under the same
                                      # umbrella publish formation/drone<N> on the shared telemetry bus (swarm_ops README 5)
telemetry_port: 9100                  # `telemetry`: drone_gui's fleet feed (drone_telemetry/README.md, UDP JSON
                                      # v1; add this laptop's LAN address:9100 to its destinations)
attacker_names: []                    # `bus`: e.g. [drone4, drone5] (empty = first two formation/ topics); `telemetry`: e.g. [TELLO-2, TELLO-3]
scripted:                             # each flies straight at site_xyz from `start` at `speed`
  - start: [2.0, 0.3, 4.5]            # m, tag frame
    speed: 0.6                        # m/s
    delay: 0.0                        # s after the run starts
  - start: [-2.5, 0.6, 4.0]
    speed: 0.5
    delay: 0.0                        # the sim spawns both at once; with one attacker alive two defenders
                                      # are goalkeepers and crowd the site (try 3.0 to see it)
capture_radius: 0.5                   # m: a scripted attacker this close to a defender is "down"
respawn_s: 0.0                        # a down / arrived attacker restarts after this; 0 = never (sim eval: no waves)
udp_port: 5005                        # `udp` (our own test feed): JSON {"attackers": [[x,y,z], [x,y,z] | null]} tag-10 frame
